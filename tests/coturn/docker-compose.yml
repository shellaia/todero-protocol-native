services:
  coturn:
    image: coturn/coturn:4.6.3
    command: >
      -n
      --fingerprint
      --lt-cred-mech
      --realm=todero.local
      --user=testuser:testpass
      --static-auth-secret=turn-shared-secret
      --listening-port=3478
      --min-port=49160
      --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
