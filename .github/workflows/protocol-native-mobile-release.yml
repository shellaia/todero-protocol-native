name: Protocol Native Mobile Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish/build for (vX.Y.Z). If empty, builds only.'
        required: false
        type: string

permissions:
  contents: write

env:
  # Runner image contract: Android SDK/NDK is baked into our linux amd64 runner image here.
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  resolve_meta:
    name: Resolve mobile release metadata
    runs-on: [self-hosted, linux, x64, todero-amd64]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          VERSION=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
          fi
          SHOULD_PUBLISH="false"
          if [[ -n "${TAG}" ]]; then
            SHOULD_PUBLISH="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

  build_ios_arm:
    name: Build iOS device + arm64 sim
    needs: resolve_meta
    runs-on: [self-hosted, macOS, ARM64, todero-macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build iOS arm slices
        env:
          MOBILE_VERSION: ${{ needs.resolve_meta.outputs.version }}
          MOBILE_OUT_DIR: ${{ github.workspace }}/dist/mobile-ios-arm
        run: |
          chmod +x scripts/build_mobile_ios_artifacts.sh
          scripts/build_mobile_ios_artifacts.sh
      - name: Upload iOS arm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-arm
          path: |
            dist/mobile-ios-arm/iphoneos/libv3_ffi.dylib
            dist/mobile-ios-arm/iphonesimulator/libv3_ffi.dylib
            dist/mobile-ios-arm/headers/v3_ffi.h
            dist/mobile-ios-arm/modules/module.modulemap
            dist/mobile-ios-arm/metadata.json

  build_ios_x64sim:
    name: Build iOS x64 sim
    needs: resolve_meta
    # Build the x64 simulator slice on Apple Silicon to avoid reliance on Intel
    # runner Xcode/SDK drift (iphonesimulator SDK must be present for openssl-sys).
    runs-on: [self-hosted, macOS, ARM64, todero-macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Apple Rust target
        run: rustup target add x86_64-apple-ios
      - name: Build x64 simulator slice
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET:-13.0}"
          cargo rustc --manifest-path Cargo.toml -p v3-ffi --release --target x86_64-apple-ios --lib -- --crate-type cdylib
          mkdir -p dist/mobile-ios-x64/iphonesimulator
          cp target/x86_64-apple-ios/release/libv3_ffi.dylib dist/mobile-ios-x64/iphonesimulator/libv3_ffi.dylib
      - name: Upload iOS x64 simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-x64
          path: dist/mobile-ios-x64/iphonesimulator/libv3_ffi.dylib

  package_ios:
    name: Package iOS xcframework
    runs-on: [self-hosted, macOS, ARM64, todero-macos-arm64]
    needs: [resolve_meta, build_ios_arm, build_ios_x64sim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-ios-arm
          path: dist/mobile-ios-arm
      - uses: actions/download-artifact@v4
        with:
          name: mobile-ios-x64
          # The x64 artifact is uploaded as a single file; download it directly
          # into the expected directory for lipo.
          path: dist/mobile-ios-x64/iphonesimulator
      - name: Assemble xcframework
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_meta.outputs.version }}"
          OUT="dist/mobile/${VERSION}/ios"
          mkdir -p "${OUT}/headers" "${OUT}/modules" "${OUT}/iphoneos" "${OUT}/iphonesimulator"
          cp dist/mobile-ios-arm/headers/v3_ffi.h "${OUT}/headers/v3_ffi.h"
          cp dist/mobile-ios-arm/modules/module.modulemap "${OUT}/modules/module.modulemap"
          cp dist/mobile-ios-arm/iphoneos/libv3_ffi.dylib "${OUT}/iphoneos/libv3_ffi.dylib"
          cp dist/mobile-ios-arm/metadata.json "${OUT}/metadata.json"
          lipo -create \
            dist/mobile-ios-arm/iphonesimulator/libv3_ffi.dylib \
            dist/mobile-ios-x64/iphonesimulator/libv3_ffi.dylib \
            -output "${OUT}/iphonesimulator/libv3_ffi.dylib"

          create_framework() {
            local source_lib="$1"
            local framework_root="$2"
            mkdir -p "${framework_root}/Headers" "${framework_root}/Modules"
            cp "${OUT}/headers/v3_ffi.h" "${framework_root}/Headers/v3_ffi.h"
            cp "${OUT}/modules/module.modulemap" "${framework_root}/Modules/module.modulemap"
            cp "${source_lib}" "${framework_root}/v3_ffi"
            chmod +x "${framework_root}/v3_ffi"
            install_name_tool -id "@rpath/v3_ffi.framework/v3_ffi" "${framework_root}/v3_ffi"
            {
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
              printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              printf '%s\n' '<plist version="1.0">'
              printf '%s\n' '<dict>'
              printf '%s\n' '  <key>CFBundleExecutable</key>'
              printf '%s\n' '  <string>v3_ffi</string>'
              printf '%s\n' '  <key>CFBundleIdentifier</key>'
              printf '%s\n' '  <string>com.shellaia.todero.v3ffi</string>'
              printf '%s\n' '  <key>CFBundleName</key>'
              printf '%s\n' '  <string>v3_ffi</string>'
              printf '%s\n' '  <key>CFBundlePackageType</key>'
              printf '%s\n' '  <string>FMWK</string>'
              printf '%s\n' '  <key>CFBundleShortVersionString</key>'
              printf '%s\n' "  <string>${VERSION}</string>"
              printf '%s\n' '  <key>CFBundleVersion</key>'
              printf '%s\n' "  <string>${VERSION}</string>"
              printf '%s\n' '  <key>MinimumOSVersion</key>'
              printf '%s\n' '  <string>13.0</string>'
              printf '%s\n' '</dict>'
              printf '%s\n' '</plist>'
            } > "${framework_root}/Info.plist"
          }

          create_framework "${OUT}/iphoneos/libv3_ffi.dylib" "${OUT}/iphoneos/v3_ffi.framework"
          create_framework "${OUT}/iphonesimulator/libv3_ffi.dylib" "${OUT}/iphonesimulator/v3_ffi.framework"

          xcodebuild -create-xcframework \
            -framework "${OUT}/iphoneos/v3_ffi.framework" \
            -framework "${OUT}/iphonesimulator/v3_ffi.framework" \
            -output "${OUT}/v3_ffi.xcframework" >/dev/null
      - name: Create SPM-ready xcframework zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_meta.outputs.version }}"
          OUT="dist/mobile/${VERSION}/ios"
          rm -f "${OUT}/v3_ffi.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "${OUT}/v3_ffi.xcframework" \
            "${OUT}/v3_ffi.xcframework.zip"
      - name: Upload packaged iOS mobile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-package
          path: |
            dist/mobile/*/ios/v3_ffi.xcframework.zip
            dist/mobile/*/ios/metadata.json

  build_android:
    name: Build Android jniLibs
    needs: resolve_meta
    runs-on: [self-hosted, linux, x64, todero-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build Android mobile artifacts
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_VERSION: 26.3.11579264
          ANDROID_MIN_SDK: 21
          MOBILE_VERSION: ${{ needs.resolve_meta.outputs.version }}
        run: |
          chmod +x scripts/build_mobile_android_artifacts.sh
          scripts/build_mobile_android_artifacts.sh
      - name: Upload Android mobile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: dist/mobile/*/android

  publish_android_maven:
    name: Publish Android AAR to Maven Central
    if: needs.resolve_meta.outputs.should_publish == 'true'
    runs-on: [self-hosted, linux, x64, todero-amd64]
    needs: [resolve_meta, build_android]
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      TODERO_ANDROID_PUBLISH_VERSION: ${{ needs.resolve_meta.outputs.version }}
      ANDROID_MIN_SDK: 21
      ANDROID_COMPILE_SDK: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: dist/mobile-release/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage jniLibs into Android AAR module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-aar/src/main/jniLibs
          mkdir -p android-aar/src/main
          src_jni="$(find dist/mobile-release/android -maxdepth 8 -type d -name jniLibs -print -quit || true)"
          if [[ -z "${src_jni}" ]]; then
            echo "error: jniLibs not found under dist/mobile-release/android" >&2
            find dist/mobile-release/android -maxdepth 5 -print >&2 || true
            exit 1
          fi
          cp -R "${src_jni}" android-aar/src/main/jniLibs
      - name: Validate Android AAR inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f android-aar/src/main/jniLibs/arm64-v8a/libv3_ffi.so
          test -f android-aar/src/main/jniLibs/x86_64/libv3_ffi.so
      - name: Publish Android AAR
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-aar publishAndReleaseToMavenCentral --no-daemon --stacktrace

  publish_mobile_release:
    name: Publish mobile release assets
    if: needs.resolve_meta.outputs.should_publish == 'true'
    runs-on: [self-hosted, linux, x64, todero-amd64]
    needs: [resolve_meta, package_ios, build_android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mobile-ios-package
          path: dist/mobile-release
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: dist/mobile-release
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve_meta.outputs.version }}"
          echo "Preparing mobile release assets for version ${VERSION}"
          echo "Downloaded artifact tree:"
          find dist/mobile-release -maxdepth 5 -type f | sort || true

          ios_zip="$(find dist/mobile-release -name "v3_ffi.xcframework.zip" -print -quit || true)"
          ios_meta="$(find dist/mobile-release -path "*/ios/metadata.json" -print -quit || true)"
          android_zip="$(find dist/mobile-release -name "todero-native-mobile-android-${VERSION}.zip" -print -quit || true)"
          android_symbols_zip="$(find dist/mobile-release -name "todero-native-mobile-android-symbols-${VERSION}.zip" -print -quit || true)"
          android_meta="$(find dist/mobile-release -path "*/android/metadata.json" -print -quit || true)"

          echo "Resolved iOS zip: ${ios_zip:-<missing>}"
          echo "Resolved iOS metadata: ${ios_meta:-<missing>}"
          echo "Resolved Android zip: ${android_zip:-<missing>}"
          echo "Resolved Android symbols zip: ${android_symbols_zip:-<missing>}"
          echo "Resolved Android metadata: ${android_meta:-<missing>}"

          if [[ -z "${ios_zip}" || -z "${ios_meta}" || -z "${android_zip}" || -z "${android_symbols_zip}" || -z "${android_meta}" ]]; then
            echo "error: one or more required mobile release assets are missing" >&2
            find dist/mobile-release -maxdepth 5 -type f | sort >&2 || true
            exit 1
          fi

          mkdir -p "dist/mobile-release/android"
          cp -f "${ios_zip}" "dist/mobile-release/v3_ffi.xcframework.zip"
          cp -f "${android_zip}" "dist/mobile-release/android/todero-native-mobile-android-${VERSION}.zip"
          cp -f "${android_symbols_zip}" "dist/mobile-release/android/todero-native-mobile-android-symbols-${VERSION}.zip"
          cp -f "${android_meta}" "dist/mobile-release/android/metadata.json"
          cp -f "${ios_meta}" "dist/mobile-release/todero-native-mobile-ios-metadata-${VERSION}.json"
          cp "dist/mobile-release/android/metadata.json" "dist/mobile-release/todero-native-mobile-android-metadata-${VERSION}.json"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_meta.outputs.tag }}
          files: |
            dist/mobile-release/v3_ffi.xcframework.zip
            dist/mobile-release/android/todero-native-mobile-android-${{ needs.resolve_meta.outputs.version }}.zip
            dist/mobile-release/android/todero-native-mobile-android-symbols-${{ needs.resolve_meta.outputs.version }}.zip
            dist/mobile-release/todero-native-mobile-ios-metadata-${{ needs.resolve_meta.outputs.version }}.json
            dist/mobile-release/todero-native-mobile-android-metadata-${{ needs.resolve_meta.outputs.version }}.json
