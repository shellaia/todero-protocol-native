name: Protocol Native Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish to (for example: v1.2.3). If empty, artifacts are built only.'
        required: false
        type: string
      publish_debug_mirror:
        description: 'If true, also publish artifacts to GitHub Release as debug mirror.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: protocol-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_native:
    name: Build native ${{ matrix.target_id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: linux-x86_64-gnu
            runner: ubuntu-latest
            lib_name: libv3_ffi.so
            os_family: linux
            arch: x86_64
            toolchain: gnu
            target_triple: x86_64-unknown-linux-gnu
          - target_id: linux-aarch64-gnu
            runner: ubuntu-24.04-arm
            lib_name: libv3_ffi.so
            os_family: linux
            arch: aarch64
            toolchain: gnu
            target_triple: aarch64-unknown-linux-gnu
          - target_id: darwin-aarch64
            runner: macos-14
            lib_name: libv3_ffi.dylib
            os_family: darwin
            arch: aarch64
            toolchain: darwin
            target_triple: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          VERSION=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev dpkg-dev rpm

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          for formula in pkgconf openssl@3; do
            if ! brew list --versions "${formula}" >/dev/null 2>&1; then
              brew install "${formula}"
            fi
          done

      - name: Build v3-ffi release library
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p v3-ffi --release

      - name: Native smoke check
        shell: bash
        run: |
          set -euo pipefail
          LIB_PATH="target/release/${{ matrix.lib_name }}"
          test -s "${LIB_PATH}"
          file "${LIB_PATH}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            nm -gU "${LIB_PATH}" | grep -q "v3_ffi_abi_version"
          else
            nm -D "${LIB_PATH}" | grep -q "v3_ffi_abi_version" || nm -g "${LIB_PATH}" | grep -q "v3_ffi_abi_version"
          fi

      - name: Package native artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET_ID="${{ matrix.target_id }}"
          LIB_NAME="${{ matrix.lib_name }}"
          LIB_PATH="target/release/${LIB_NAME}"

          OUT_DIR="dist/native"
          PAYLOAD_DIR="${OUT_DIR}/${TARGET_ID}"
          ARCHIVE="todero-native-${TARGET_ID}-${VERSION}.tar.gz"
          META_OUT="${OUT_DIR}/metadata-${TARGET_ID}.json"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p "${PAYLOAD_DIR}"
          cp "${LIB_PATH}" "${PAYLOAD_DIR}/${LIB_NAME}"

          cat > "${PAYLOAD_DIR}/metadata.json" <<META
          {
            "name": "todero-native",
            "version": "${VERSION}",
            "target_id": "${{ matrix.target_id }}",
            "target_triple": "${{ matrix.target_triple }}",
            "os": "${{ matrix.os_family }}",
            "arch": "${{ matrix.arch }}",
            "toolchain": "${{ matrix.toolchain }}",
            "commit": "${{ github.sha }}",
            "built_at": "${BUILT_AT}",
            "library": "${LIB_NAME}"
          }
          META

          tar -C "${OUT_DIR}" -czf "${OUT_DIR}/${ARCHIVE}" "${TARGET_ID}"

          python3 - <<PY
          import json
          import hashlib
          from pathlib import Path
          metadata_path = Path("${PAYLOAD_DIR}/metadata.json")
          archive = Path("${OUT_DIR}/${ARCHIVE}")
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(f"${OUT_DIR}/${ARCHIVE}.sha256").write_text(f"{sha}  {archive.name}\\n", encoding="utf-8")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["sha256"] = sha
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\\n", encoding="utf-8")
          Path("${META_OUT}").write_text(json.dumps(metadata, indent=2) + "\\n", encoding="utf-8")
          PY

          echo "archive=${OUT_DIR}/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${OUT_DIR}/${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"
          echo "metadata=${META_OUT}" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages (.deb/.rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package_linux_native.sh
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET_ID="${{ matrix.target_id }}"
          LIB_NAME="${{ matrix.lib_name }}"
          LIB_PATH="target/release/${LIB_NAME}"
          META_PATH="dist/native/${TARGET_ID}/metadata.json"
          scripts/package_linux_native.sh "${VERSION}" "${TARGET_ID}" "${LIB_PATH}" "${META_PATH}" "dist/native/packages"

      - name: Upload target artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target_id }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.metadata }}
            dist/native/packages/**/*.deb
            dist/native/packages/**/*.rpm
          if-no-files-found: error

  publish_and_gate:
    name: Publish and gate Tier-1 coverage
    runs-on: ubuntu-latest
    needs: build_native

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          VERSION=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Prepare clean release staging directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/release
          mkdir -p dist/release

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/release

      - name: Gate Tier-1 artifacts present
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=(
            "linux-x86_64-gnu"
            "linux-aarch64-gnu"
            "darwin-aarch64"
          )
          for t in "${expected[@]}"; do
            archives=(dist/release/todero-native-"${t}"-*.tar.gz)
            checksums=(dist/release/todero-native-"${t}"-*.tar.gz.sha256)
            metadata=(dist/release/metadata-"${t}".json)
            if [[ ${#archives[@]} -lt 1 ]]; then
              echo "Missing native archive for target ${t}" >&2
              exit 1
            fi
            if [[ ${#archives[@]} -ne 1 ]]; then
              echo "Expected exactly one native archive for target ${t}, found ${#archives[@]}" >&2
              exit 1
            fi
            if [[ ${#checksums[@]} -lt 1 ]]; then
              echo "Missing checksum for target ${t}" >&2
              exit 1
            fi
            if [[ ${#checksums[@]} -ne 1 ]]; then
              echo "Expected exactly one checksum for target ${t}, found ${#checksums[@]}" >&2
              exit 1
            fi
            if [[ ${#metadata[@]} -lt 1 ]]; then
              echo "Missing metadata JSON for target ${t}" >&2
              exit 1
            fi
            if [[ ${#metadata[@]} -ne 1 ]]; then
              echo "Expected exactly one metadata JSON for target ${t}, found ${#metadata[@]}" >&2
              exit 1
            fi
          done
          deb_amd64=(dist/release/packages/deb/todero-native_*_amd64.deb)
          deb_arm64=(dist/release/packages/deb/todero-native_*_arm64.deb)
          rpm_x64=(dist/release/packages/rpm/todero-native-*.x86_64.rpm)
          rpm_arm64=(dist/release/packages/rpm/todero-native-*.aarch64.rpm)
          if [[ ${#deb_amd64[@]} -lt 1 || ${#deb_arm64[@]} -lt 1 ]]; then
            echo "Missing expected .deb packages (amd64/arm64)." >&2
            exit 1
          fi
          if [[ ${#rpm_x64[@]} -lt 1 || ${#rpm_arm64[@]} -lt 1 ]]; then
            echo "Missing expected .rpm packages (x86_64/aarch64)." >&2
            exit 1
          fi

      - name: Build release manifest
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          release_dir = Path("dist/release")
          archives = sorted(release_dir.glob("todero-native-*.tar.gz"))
          if not archives:
              raise SystemExit("No native archives found")

          version = os.environ.get("VERSION", "").strip()
          if not version:
              raise SystemExit("Missing VERSION in environment")

          entries = []
          seen_archive_names = set()
          suffix = f"-{version}.tar.gz"
          for a in archives:
              name = a.name
              if not name.startswith("todero-native-") or not name.endswith(suffix):
                  raise SystemExit(f"Archive name does not match resolved version {version}: {name}")
              if name in seen_archive_names:
                  raise SystemExit(f"Duplicate archive artifact name detected: {name}")
              seen_archive_names.add(name)
              target_id = name.removeprefix("todero-native-").removesuffix(suffix)
              if not target_id:
                  raise SystemExit(f"Unable to resolve target_id from archive: {name}")
              sha_file = a.with_suffix(a.suffix + ".sha256")
              sha = sha_file.read_text(encoding="utf-8").split()[0]
              for channel in ("apt", "yum", "brew"):
                  entries.append({
                      "name": "todero-native",
                      "version": version,
                      "channel": channel,
                      "target_id": target_id,
                      "artifact_path": a.name,
                      "publication_path": a.name,
                      "sha256": sha,
                  })
          seen_entries = set()
          for e in entries:
              key = (e["channel"], e["target_id"], e["version"])
              if key in seen_entries:
                  raise SystemExit(f"Duplicate manifest entry tuple detected: {key}")
              seen_entries.add(key)

          manifest = {
              "version": version,
              "release_tag": "${{ github.ref_name }}" if "${{ github.ref }}".startswith("refs/tags/") else "",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "native_artifacts": entries,
              "build": {
                  "workflow": "${{ github.workflow }}",
                  "run_id": "${{ github.run_id }}",
                  "run_number": "${{ github.run_number }}",
                  "sha": "${{ github.sha }}",
              },
          }

          out = release_dir / f"todero-release-manifest-{version}.json"
          out.write_text(json.dumps(manifest, indent=2) + "\\n", encoding="utf-8")
          print(out)
          PY

      - name: Validate release manifest schema and artifact mapping
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def load_json_single_or_concatenated(path: Path):
            text = path.read_text(encoding="utf-8")
            decoder = json.JSONDecoder()
            idx = 0
            n = len(text)
            while idx < n and text[idx].isspace():
              idx += 1
            if idx >= n:
              raise SystemExit(f"manifest is empty: {path}")
            obj, end = decoder.raw_decode(text, idx)
            trailing = text[end:].strip()
            if trailing:
              # Keep pipeline deterministic even if the file was accidentally appended/concatenated.
              preview = trailing[:120].replace("\n", "\\n")
              print(f"warning: manifest contained trailing content after first JSON document; canonicalizing (trailing preview: {preview})")
              path.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")
            return obj

          version = os.environ["VERSION"]
          release_dir = Path("dist/release")
          manifest_path = release_dir / f"todero-release-manifest-{version}.json"
          if not manifest_path.is_file():
            raise SystemExit(f"missing manifest: {manifest_path}")
          data = load_json_single_or_concatenated(manifest_path)
          if not isinstance(data, dict):
            raise SystemExit("manifest root must be object")
          if data.get("version") != version:
            raise SystemExit(f"manifest version mismatch: {data.get('version')} != {version}")
          entries = data.get("native_artifacts")
          if not isinstance(entries, list) or not entries:
            raise SystemExit("manifest native_artifacts must be non-empty list")

          required_keys = {
            "name", "version", "channel", "target_id", "artifact_path", "publication_path", "sha256"
          }
          seen = set()
          for idx, e in enumerate(entries):
            if not isinstance(e, dict):
              raise SystemExit(f"entry[{idx}] must be object")
            missing = required_keys - set(e.keys())
            if missing:
              raise SystemExit(f"entry[{idx}] missing keys: {sorted(missing)}")
            if e["name"] != "todero-native":
              raise SystemExit(f"entry[{idx}] unexpected name: {e['name']}")
            if e["version"] != version:
              raise SystemExit(f"entry[{idx}] version mismatch: {e['version']}")
            if e["channel"] not in {"apt", "yum", "brew"}:
              raise SystemExit(f"entry[{idx}] invalid channel: {e['channel']}")
            if e["publication_path"] != e["artifact_path"]:
              raise SystemExit(f"entry[{idx}] publication_path must equal artifact_path")
            key = (e["channel"], e["target_id"], e["version"])
            if key in seen:
              raise SystemExit(f"duplicate manifest tuple: {key}")
            seen.add(key)

            archive_path = release_dir / e["artifact_path"]
            if not archive_path.is_file():
              raise SystemExit(f"entry[{idx}] missing archive: {archive_path}")
            checksum_path = archive_path.with_suffix(archive_path.suffix + ".sha256")
            if not checksum_path.is_file():
              raise SystemExit(f"entry[{idx}] missing checksum: {checksum_path}")
            declared_sha = e["sha256"].strip().lower()
            sha_line = checksum_path.read_text(encoding="utf-8").strip().split()
            if not sha_line:
              raise SystemExit(f"entry[{idx}] invalid checksum file: {checksum_path}")
            file_sha = sha_line[0].strip().lower()
            if file_sha != declared_sha:
              raise SystemExit(f"entry[{idx}] checksum mismatch manifest vs sha file for {archive_path.name}")
            computed_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest().lower()
            if computed_sha != declared_sha:
              raise SystemExit(f"entry[{idx}] checksum mismatch manifest vs archive bytes for {archive_path.name}")

          print(f"manifest validation passed: entries={len(entries)}")
          PY

      - name: Generate brew formula
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
        run: |
          set -euo pipefail
          chmod +x scripts/generate_brew_formula.sh
          base_url="https://brew.social100.com/${S3_PREFIX%/}"
          scripts/generate_brew_formula.sh "${VERSION}" "${base_url}" "dist/release"

      - name: Validate generated brew formula URL and checksum
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
        run: |
          set -euo pipefail
          formula="dist/release/todero-native.rb"
          archive="dist/release/todero-native-darwin-aarch64-${VERSION}.tar.gz"
          test -f "${formula}"
          test -f "${archive}"
          expected_url="https://brew.social100.com/${S3_PREFIX%/}/todero-native-darwin-aarch64-${VERSION}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            expected_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          else
            expected_sha="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          fi
          formula_url="$(awk -F'"' '/^[[:space:]]*url /{print $2; exit}' "${formula}")"
          formula_sha="$(awk -F'"' '/^[[:space:]]*sha256 /{print $2; exit}' "${formula}")"
          if [[ -z "${formula_url}" || -z "${formula_sha}" ]]; then
            echo "Failed to parse url/sha256 from ${formula}" >&2
            exit 1
          fi
          [[ "${formula_url}" == "${expected_url}" ]]
          [[ "${formula_sha}" == "${expected_sha}" ]]

      - name: Install packaging metadata toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c

      - name: Build apt/yum repository metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_package_repos.sh
          scripts/build_package_repos.sh dist/release

      - name: Sign apt repository metadata
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign_package_repos.sh
          scripts/sign_package_repos.sh apt dist/release/repos/apt

      - name: Sign yum repository metadata
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.YUM_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.YUM_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.YUM_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign_package_repos.sh
          scripts/sign_package_repos.sh yum dist/release/repos/yum

      - name: Sign release artifacts (APT key)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign_release_artifacts.sh
          scripts/sign_release_artifacts.sh dist/release ".apt.asc" "todero-native-repo-apt"

      - name: Sign release artifacts (YUM key)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.YUM_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.YUM_GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.YUM_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/sign_release_artifacts.sh
          scripts/sign_release_artifacts.sh dist/release ".yum.asc" "todero-native-repo-yum"

      - name: Verify apt repository metadata signatures
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_package_repo_signatures.sh
          scripts/verify_package_repo_signatures.sh apt dist/release/repos/apt dist/release/todero-native-repo-apt.asc

      - name: Verify yum repository metadata signatures
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_package_repo_signatures.sh
          scripts/verify_package_repo_signatures.sh yum dist/release/repos/yum dist/release/todero-native-repo-yum.asc

      - name: Verify release signatures (APT key)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_release_signatures.sh
          scripts/verify_release_signatures.sh dist/release ".apt.asc" dist/release/todero-native-repo-apt.asc

      - name: Verify release signatures (YUM key)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify_release_signatures.sh
          scripts/verify_release_signatures.sh dist/release ".yum.asc" dist/release/todero-native-repo-yum.asc

      - name: Verify checksum files map to exact binaries
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sums=(dist/release/*.sha256)
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo "No checksum files found in dist/release" >&2
            exit 1
          fi
          (
            cd dist/release
            sha256sum -c --strict --quiet ./*.sha256
          )

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish native artifacts to channel backing stores
        shell: bash
        env:
          S3_BUCKET_APT: ${{ secrets.S3_BUCKET_APT }}
          S3_BUCKET_YUM: ${{ secrets.S3_BUCKET_YUM }}
          S3_BUCKET_BREW: ${{ secrets.S3_BUCKET_BREW }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for b in S3_BUCKET_APT S3_BUCKET_YUM S3_BUCKET_BREW S3_PREFIX; do
            if [[ -z "${!b:-}" ]]; then
              echo "Missing required env var: ${b}" >&2
              exit 1
            fi
          done
          PREFIX="${S3_PREFIX%/}"
          if [[ -z "${VERSION}" ]]; then
            echo "Missing resolved version for native publish." >&2
            exit 1
          fi

          SNAPSHOT_APT="s3://${S3_BUCKET_APT}/${PREFIX}/releases/${VERSION}/"
          ALIAS_APT="s3://${S3_BUCKET_APT}/${PREFIX}/channels/stable/"
          MANIFEST_APT_KEY="${PREFIX}/releases/manifest.json"
          SNAPSHOT_YUM="s3://${S3_BUCKET_YUM}/${PREFIX}/releases/${VERSION}/"
          ALIAS_YUM="s3://${S3_BUCKET_YUM}/${PREFIX}/"
          MANIFEST_YUM_KEY="${PREFIX}/releases/manifest.json"
          SNAPSHOT_BREW="s3://${S3_BUCKET_BREW}/${PREFIX}/releases/${VERSION}/"
          ALIAS_BREW="s3://${S3_BUCKET_BREW}/${PREFIX}/"
          MANIFEST_BREW_KEY="${PREFIX}/releases/manifest.json"

          STAGE_ROOT="$(mktemp -d)"
          trap 'rm -rf "${STAGE_ROOT}"' EXIT
          STAGE_APT="${STAGE_ROOT}/apt"
          STAGE_YUM="${STAGE_ROOT}/yum"
          STAGE_BREW="${STAGE_ROOT}/brew"
          export STAGE_APT STAGE_YUM STAGE_BREW
          mkdir -p "${STAGE_APT}" "${STAGE_YUM}" "${STAGE_BREW}"

          # Common artifacts copied to all channels.
          find dist/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} "${STAGE_APT}/" \;
          find dist/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} "${STAGE_YUM}/" \;
          find dist/release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} "${STAGE_BREW}/" \;

          # Brew-specific formula.
          cp dist/release/todero-native.rb "${STAGE_BREW}/"

          # Channel-keyed signatures/public keys.
          find dist/release -maxdepth 1 -type f -name '*.apt.asc' -exec cp {} "${STAGE_APT}/" \;
          cp dist/release/todero-native-repo-apt.gpg "${STAGE_APT}/"
          cp dist/release/todero-native-repo-apt.asc "${STAGE_APT}/"
          cp -a dist/release/repos/apt/. "${STAGE_APT}/"

          find dist/release -maxdepth 1 -type f -name '*.yum.asc' -exec cp {} "${STAGE_YUM}/" \;
          cp dist/release/todero-native-repo-yum.gpg "${STAGE_YUM}/"
          cp dist/release/todero-native-repo-yum.asc "${STAGE_YUM}/"
          cp -a dist/release/repos/yum/. "${STAGE_YUM}/"

          # Build per-channel manifest with only that channel's entries.
          build_channel_manifest() {
            local channel="$1"
            local out_dir="$2"
            python3 scripts/filter_channel_manifest.py \
              "dist/release/todero-release-manifest-${VERSION}.json" \
              "${out_dir}/todero-release-manifest-${VERSION}.json" \
              "${channel}" \
              "${VERSION}"
          }
          build_channel_manifest "apt" "${STAGE_APT}"
          build_channel_manifest "yum" "${STAGE_YUM}"
          build_channel_manifest "brew" "${STAGE_BREW}"

          # Validate filtered manifests are non-empty, well-formed, and map to staged artifacts.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          stage = {
              "apt": Path(os.environ["STAGE_APT"]),
              "yum": Path(os.environ["STAGE_YUM"]),
              "brew": Path(os.environ["STAGE_BREW"]),
          }
          required = {"name", "version", "channel", "target_id", "artifact_path", "publication_path", "sha256"}
          for channel, root in stage.items():
              mf = root / f"todero-release-manifest-{version}.json"
              if not mf.is_file():
                  raise SystemExit(f"missing filtered manifest: {mf}")
              data = json.loads(mf.read_text(encoding="utf-8"))
              entries = data.get("native_artifacts")
              if not isinstance(entries, list) or not entries:
                  raise SystemExit(f"filtered manifest empty for channel={channel}")
              for idx, e in enumerate(entries):
                  if not isinstance(e, dict):
                      raise SystemExit(f"{mf} entry[{idx}] is not object")
                  missing = required - set(e.keys())
                  if missing:
                      raise SystemExit(f"{mf} entry[{idx}] missing keys: {sorted(missing)}")
                  if e["channel"] != channel:
                      raise SystemExit(f"{mf} entry[{idx}] wrong channel={e['channel']}")
                  if e["version"] != version:
                      raise SystemExit(f"{mf} entry[{idx}] wrong version={e['version']}")
                  if e["publication_path"] != e["artifact_path"]:
                      raise SystemExit(f"{mf} entry[{idx}] publication_path mismatch")

                  artifact = root / e["artifact_path"]
                  if not artifact.is_file():
                      raise SystemExit(f"{mf} entry[{idx}] missing staged artifact: {artifact}")
                  checksum = root / f"{e['artifact_path']}.sha256"
                  if not checksum.is_file():
                      raise SystemExit(f"{mf} entry[{idx}] missing staged checksum: {checksum}")
                  sha_line = checksum.read_text(encoding="utf-8").strip().split()
                  if not sha_line:
                      raise SystemExit(f"{mf} entry[{idx}] malformed checksum file")
                  declared = e["sha256"].strip().lower()
                  if sha_line[0].strip().lower() != declared:
                      raise SystemExit(f"{mf} entry[{idx}] manifest/checksum mismatch")
                  computed = hashlib.sha256(artifact.read_bytes()).hexdigest().lower()
                  if computed != declared:
                      raise SystemExit(f"{mf} entry[{idx}] artifact digest mismatch")
          print("filtered manifest validation passed")
          PY

          # Immutable snapshots + alias update (per-channel payload only).
          aws s3 cp "${STAGE_APT}/" "${SNAPSHOT_APT}" --recursive \
              --cache-control "max-age=31536000, immutable"
          aws s3 cp "${STAGE_APT}/" "${ALIAS_APT}" --recursive
          aws s3 cp "${STAGE_YUM}/" "${SNAPSHOT_YUM}" --recursive \
              --cache-control "max-age=31536000, immutable"
          aws s3 cp "${STAGE_YUM}/" "${ALIAS_YUM}" --recursive
          aws s3 cp "${STAGE_BREW}/" "${SNAPSHOT_BREW}" --recursive \
              --cache-control "max-age=31536000, immutable"
          aws s3 cp "${STAGE_BREW}/" "${ALIAS_BREW}" --recursive

          # Mutable alias metadata/checksums: short TTL to avoid explicit invalidations.
          aws s3 cp "${STAGE_APT}/" "${ALIAS_APT}" \
              --recursive \
              --exclude "*" \
              --include "*.json" \
              --include "*.sha256" \
              --include "dists/stable/Release" \
              --include "dists/stable/Release.gpg" \
              --include "dists/stable/InRelease" \
              --include "dists/stable/main/binary-amd64/Packages" \
              --include "dists/stable/main/binary-amd64/Packages.gz" \
              --include "dists/stable/main/binary-arm64/Packages" \
              --include "dists/stable/main/binary-arm64/Packages.gz" \
              --include "*.apt.asc" \
              --include "todero-native-repo-apt.gpg" \
              --include "todero-native-repo-apt.asc" \
              --metadata-directive REPLACE \
              --cache-control "max-age=60, must-revalidate"
          aws s3 cp "${STAGE_YUM}/" "${ALIAS_YUM}" \
              --recursive \
              --exclude "*" \
              --include "*.json" \
              --include "*.sha256" \
              --include "repodata/*" \
              --include "*.yum.asc" \
              --include "todero-native-repo-yum.gpg" \
              --include "todero-native-repo-yum.asc" \
              --metadata-directive REPLACE \
              --cache-control "max-age=60, must-revalidate"
          aws s3 cp "${STAGE_BREW}/" "${ALIAS_BREW}" \
              --recursive \
              --exclude "*" \
              --include "*.json" \
              --include "*.sha256" \
              --include "*.rb" \
              --metadata-directive REPLACE \
              --cache-control "max-age=60, must-revalidate"

          update_native_manifest() {
            local bucket="$1"
            local key="$2"
            local snapshot="$3"
            local alias="$4"
            local tmp_dir
            local in_file
            local out_file
            local published_at

            tmp_dir="$(mktemp -d)"
            in_file="${tmp_dir}/manifest.json"
            out_file="${tmp_dir}/manifest.updated.json"
            published_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            if ! aws s3 cp "s3://${bucket}/${key}" "${in_file}" >/dev/null 2>&1; then
              printf '{"schema":1,"project":"todero-native","channel":"native","releases":[]}\n' > "${in_file}"
            fi

            helper="${GITHUB_WORKSPACE}/scripts/update_native_manifest.py"
            if [[ -f "${helper}" ]]; then
              python3 "${helper}" \
                "${in_file}" \
                "${out_file}" \
                "${VERSION}" \
                "${published_at}" \
                "${snapshot}" \
                "${alias}"
            else
              echo "Missing helper script: ${helper}" >&2
              ls -la "${GITHUB_WORKSPACE}/scripts" >&2 || true
              exit 1
            fi

            aws s3 cp "${out_file}" "s3://${bucket}/${key}" \
              --metadata-directive REPLACE \
              --cache-control "max-age=60, must-revalidate"
            rm -rf "${tmp_dir}"
          }

          update_native_manifest "${S3_BUCKET_APT}" "${MANIFEST_APT_KEY}" "${SNAPSHOT_APT}" "${ALIAS_APT}"
          update_native_manifest "${S3_BUCKET_YUM}" "${MANIFEST_YUM_KEY}" "${SNAPSHOT_YUM}" "${ALIAS_YUM}"
          update_native_manifest "${S3_BUCKET_BREW}" "${MANIFEST_BREW_KEY}" "${SNAPSHOT_BREW}" "${ALIAS_BREW}"

          # Validate per-bucket release history manifest contract.
          validate_bucket_manifest() {
            local bucket="$1"
            local key="$2"
            local expected_snapshot="$3"
            local expected_alias="$4"
            local tmp_dir
            local file
            tmp_dir="$(mktemp -d)"
            file="${tmp_dir}/manifest.json"
            aws s3 cp "s3://${bucket}/${key}" "${file}" >/dev/null
            python3 scripts/validate_bucket_manifest.py \
              "${file}" \
              "${VERSION}" \
              "${expected_snapshot}" \
              "${expected_alias}"
            rm -rf "${tmp_dir}"
          }

          validate_bucket_manifest "${S3_BUCKET_APT}" "${MANIFEST_APT_KEY}" "${SNAPSHOT_APT}" "${ALIAS_APT}"
          validate_bucket_manifest "${S3_BUCKET_YUM}" "${MANIFEST_YUM_KEY}" "${SNAPSHOT_YUM}" "${ALIAS_YUM}"
          validate_bucket_manifest "${S3_BUCKET_BREW}" "${MANIFEST_BREW_KEY}" "${SNAPSHOT_BREW}" "${ALIAS_BREW}"

          # Post-upload HEAD checks for critical objects.
          head_uri() {
            local uri="$1"
            local no_scheme="${uri#s3://}"
            local bucket="${no_scheme%%/*}"
            local key="${no_scheme#*/}"
            aws s3api head-object --bucket "${bucket}" --key "${key}" >/dev/null
          }

          verify_channel_objects() {
            local snapshot_root="$1"
            local alias_root="$2"
            local check_formula="$3"
            local check_apt_repo="$4"
            local check_yum_repo="$5"
            local version_manifest="todero-release-manifest-${VERSION}.json"
            local targets=(
              "linux-x86_64-gnu"
              "linux-aarch64-gnu"
              "darwin-aarch64"
            )

            for t in "${targets[@]}"; do
              local archive="todero-native-${t}-${VERSION}.tar.gz"
              local checksum="${archive}.sha256"
              head_uri "${snapshot_root}${archive}"
              head_uri "${snapshot_root}${checksum}"
              head_uri "${alias_root}${archive}"
              head_uri "${alias_root}${checksum}"
            done

            head_uri "${snapshot_root}${version_manifest}"
            head_uri "${alias_root}${version_manifest}"

            if [[ "${check_formula}" == "true" ]]; then
              head_uri "${snapshot_root}todero-native.rb"
              head_uri "${alias_root}todero-native.rb"
            fi

            if [[ "${check_apt_repo}" == "true" ]]; then
              head_uri "${snapshot_root}dists/stable/InRelease"
              head_uri "${snapshot_root}dists/stable/Release"
              head_uri "${snapshot_root}dists/stable/Release.gpg"
              head_uri "${alias_root}dists/stable/InRelease"
              head_uri "${alias_root}dists/stable/Release"
              head_uri "${alias_root}dists/stable/Release.gpg"
            fi

            if [[ "${check_yum_repo}" == "true" ]]; then
              head_uri "${snapshot_root}repodata/repomd.xml"
              head_uri "${snapshot_root}repodata/repomd.xml.asc"
              head_uri "${alias_root}repodata/repomd.xml"
              head_uri "${alias_root}repodata/repomd.xml.asc"
            fi
          }

          verify_channel_objects "${SNAPSHOT_APT}" "${ALIAS_APT}" "false" "true" "false"
          verify_channel_objects "${SNAPSHOT_YUM}" "${ALIAS_YUM}" "false" "false" "true"
          verify_channel_objects "${SNAPSHOT_BREW}" "${ALIAS_BREW}" "true" "false" "false"

      - name: Validate alias current-only and history integrity
        shell: bash
        env:
          S3_BUCKET_APT: ${{ secrets.S3_BUCKET_APT }}
          S3_BUCKET_YUM: ${{ secrets.S3_BUCKET_YUM }}
          S3_BUCKET_BREW: ${{ secrets.S3_BUCKET_BREW }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate_alias_and_history.py
          python3 scripts/validate_alias_and_history.py \
            --bucket-apt "${S3_BUCKET_APT}" \
            --bucket-yum "${S3_BUCKET_YUM}" \
            --bucket-brew "${S3_BUCKET_BREW}" \
            --prefix "${S3_PREFIX%/}" \
            --current-version "${VERSION}"

      - name: Invalidate CloudFront metadata paths
        shell: bash
        env:
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          CF_DIST_APT: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_APT }}
          CF_DIST_YUM: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_YUM }}
          CF_DIST_BREW: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_BREW }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PREFIX="${S3_PREFIX%/}"
          for v in CF_DIST_APT CF_DIST_YUM CF_DIST_BREW; do
            if [[ -z "${!v:-}" ]]; then
              echo "Missing required repo variable: ${v}" >&2
              exit 1
            fi
          done

          apt_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_APT}" \
            --paths "/${PREFIX}/channels/stable/dists/stable/*" \
            --query 'Invalidation.Id' --output text)"
          yum_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_YUM}" \
            --paths "/${PREFIX}/x86_64/repodata/*" "/${PREFIX}/aarch64/repodata/*" \
            --query 'Invalidation.Id' --output text)"
          brew_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_BREW}" \
            --paths "/${PREFIX}/todero-native.rb" "/${PREFIX}/todero-release-manifest-*.json" \
            --query 'Invalidation.Id' --output text)"

          aws cloudfront wait invalidation-completed --distribution-id "${CF_DIST_APT}" --id "${apt_id}"
          aws cloudfront wait invalidation-completed --distribution-id "${CF_DIST_YUM}" --id "${yum_id}"
          aws cloudfront wait invalidation-completed --distribution-id "${CF_DIST_BREW}" --id "${brew_id}"

      - name: Rollback dry-drill (non-destructive)
        shell: bash
        env:
          S3_BUCKET_APT: ${{ secrets.S3_BUCKET_APT }}
          S3_BUCKET_YUM: ${{ secrets.S3_BUCKET_YUM }}
          S3_BUCKET_BREW: ${{ secrets.S3_BUCKET_BREW }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/rollback_alias_repoint.sh
          PREFIX="${S3_PREFIX%/}"

          choose_rollback_version() {
            local bucket="$1"
            local key="$2"
            local current="$3"
            local tmp
            tmp="$(mktemp)"
            if ! aws s3 cp "s3://${bucket}/${key}" "${tmp}" >/dev/null 2>&1; then
              echo "${current}"
              rm -f "${tmp}"
              return
            fi
            python3 scripts/select_rollback_version.py "$tmp" "$current"
            rm -f "${tmp}"
          }

          apt_ver="$(choose_rollback_version "${S3_BUCKET_APT}" "${PREFIX}/releases/manifest.json" "${VERSION}")"
          yum_ver="$(choose_rollback_version "${S3_BUCKET_YUM}" "${PREFIX}/releases/manifest.json" "${VERSION}")"
          brew_ver="$(choose_rollback_version "${S3_BUCKET_BREW}" "${PREFIX}/releases/manifest.json" "${VERSION}")"

          echo "rollback dry-drill versions: apt=${apt_ver} yum=${yum_ver} brew=${brew_ver}"
          scripts/rollback_alias_repoint.sh --channel apt --bucket "${S3_BUCKET_APT}" --prefix "${PREFIX}" --version "${apt_ver}"
          scripts/rollback_alias_repoint.sh --channel yum --bucket "${S3_BUCKET_YUM}" --prefix "${PREFIX}" --version "${yum_ver}"
          scripts/rollback_alias_repoint.sh --channel brew --bucket "${S3_BUCKET_BREW}" --prefix "${PREFIX}" --version "${brew_ver}"
          echo "rollback dry-drill completed"

      - name: Create GitHub App token for Brew tap
        id: brew_tap_app_token
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BREW_TAP_APP_ID }}
          private-key: ${{ secrets.BREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-todero

      - name: Publish Brew Tap formula
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BREW_TAP_REPO: ${{ vars.BREW_TAP_REPO }}
          BREW_TAP_TOKEN: ${{ steps.brew_tap_app_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${BREW_TAP_REPO:?BREW_TAP_REPO is required for tagged releases}"
          : "${BREW_TAP_TOKEN:?BREW_TAP_TOKEN is required for tagged releases}"
          test -f dist/release/todero-native.rb

          tap_dir="$(mktemp -d)"
          trap 'rm -rf "${tap_dir}"' EXIT
          git clone "https://x-access-token:${BREW_TAP_TOKEN}@github.com/${BREW_TAP_REPO}.git" "${tap_dir}"
          if ! git -C "${tap_dir}" push --dry-run origin HEAD:main >/tmp/brew_tap_push_check.log 2>&1; then
            echo "BREW_TAP_TOKEN cannot push to ${BREW_TAP_REPO} (main)." >&2
            echo "Expected: token owner has Contents: Read and write on ${BREW_TAP_REPO}." >&2
            cat /tmp/brew_tap_push_check.log >&2 || true
            exit 1
          fi
          mkdir -p "${tap_dir}/Formula"
          cp dist/release/todero-native.rb "${tap_dir}/Formula/todero-native.rb"
          (
            cd "${tap_dir}"
            # enforce ownership scope: only Formula/todero-native.rb can be changed by this workflow
            changed="$(git status --porcelain)"
            if [[ -n "${changed}" ]]; then
              invalid="$(printf '%s\n' "${changed}" | awk '{print $2}' | grep -v '^Formula/todero-native.rb$' || true)"
              if [[ -n "${invalid}" ]]; then
                echo "Unexpected changed files in tap repo:" >&2
                echo "${invalid}" >&2
                exit 1
              fi
            fi
            if [[ -z "$(git status --porcelain -- Formula/todero-native.rb)" ]]; then
              echo "No tap formula changes to publish."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/todero-native.rb
            git commit -m "Update todero-native formula"
            git push origin HEAD:main
          )

      - name: Verify Brew tap formula matches generated formula
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BREW_TAP_REPO: ${{ vars.BREW_TAP_REPO }}
          BREW_TAP_TOKEN: ${{ steps.brew_tap_app_token.outputs.token }}
        run: |
          set -euo pipefail
          : "${BREW_TAP_REPO:?BREW_TAP_REPO is required}"
          : "${BREW_TAP_TOKEN:?BREW_TAP_TOKEN is required}"
          tap_dir="$(mktemp -d)"
          trap 'rm -rf "${tap_dir}"' EXIT
          if ! git clone "https://x-access-token:${BREW_TAP_TOKEN}@github.com/${BREW_TAP_REPO}.git" "${tap_dir}"; then
            echo "Failed to clone brew tap repo. Check BREW_TAP_REPO and BREW_TAP_TOKEN permissions." >&2
            exit 1
          fi
          if [[ ! -f dist/release/todero-native.rb ]]; then
            echo "Generated formula missing: dist/release/todero-native.rb" >&2
            exit 1
          fi
          if [[ ! -f "${tap_dir}/Formula/todero-native.rb" ]]; then
            echo "Tap formula missing: ${tap_dir}/Formula/todero-native.rb" >&2
            ls -la "${tap_dir}" >&2 || true
            ls -la "${tap_dir}/Formula" >&2 || true
            exit 1
          fi
          if ! diff -u dist/release/todero-native.rb "${tap_dir}/Formula/todero-native.rb"; then
            echo "Tap formula differs from generated formula." >&2
            exit 1
          fi

      - name: Upload consolidated native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-release-bundle
          path: dist/release/*
          if-no-files-found: error

      - name: Publish GitHub release assets (debug mirror only)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'workflow_dispatch' && inputs.publish_debug_mirror == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.sha256
            dist/release/todero-release-manifest-*.json

  validate_brew_install:
    name: Validate brew tap install (arm mac)
    runs-on: macos-14
    needs: publish_and_gate
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      BREW_TAP_REPO: ${{ vars.BREW_TAP_REPO }}
    steps:
      - name: Validate tap install flow
        shell: bash
        run: |
          set -euo pipefail
          : "${BREW_TAP_REPO:?BREW_TAP_REPO is required}"
          brew untap "${BREW_TAP_REPO}" >/dev/null 2>&1 || true
          brew tap "${BREW_TAP_REPO}"
          brew reinstall todero-native || brew install todero-native
          libdir="$(tninfo --libdir)"
          [[ -n "${libdir}" ]]
          [[ -d "${libdir}" ]]
